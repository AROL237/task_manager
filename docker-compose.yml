services:
  database:
    container_name: database
    image: mysql:latest
    ports:
      - 3306:3306
    env_file:
      - prod.env
    volumes:
      - tm-data:/var/lib/mysql
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-psuper_admin",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      TM-NETWORK:
  adminer:
    container_name: adminer
    image: adminer
    ports:
      - 8585:8080
    depends_on:
      - database
    networks:
      TM-NETWORK:
  frontend:
    container_name: frontend
    image: tm_ui:0.0.3
    ports:
      - 3000:3000
    depends_on:
      - backend
    env_file:
      - prod.env
    networks:
      TM-NETWORK:
  backend:
    container_name: backend
    image: tm_api:0.0.5
    ports:
      - 8000:8000
    env_file:
      - prod.env
    depends_on:
      database:
        condition: service_healthy

    networks:
      TM-NETWORK:
  nginx:
    image: nginx:stable-perl
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      TM-NETWORK:
networks:
  TM-NETWORK:
volumes:
  tm-data:
